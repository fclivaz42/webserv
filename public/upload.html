<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
	<nav>
		<a class="request_button" href="/formulaire.html">Get in Touch !</a>
		<a class="black request_button" href="/index.html">Welcome Page</a>
		<a class="request_button" href="/upload.html">Upload a picture</a>
	</nav>

	<h1>Upload an Image</h1>
	<form class="requests" id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
	<label for="fileInput">Please upload an image:</label>
	<input type="file" id="fileInput" name="image" accept="image/*" required />
	<button class="request_button" type="submit">Upload</button>
	</form>

	<script>
	// Optional: JavaScript to handle form submission asynchronously
	document.getElementById('uploadForm').addEventListener('submit', function(event) {
	    event.preventDefault(); // Prevent the form from submitting the traditional way

	    var formData = new FormData(this);
	    
	    fetch('/upload', {
		method: 'POST',
		body: formData
	    })
	    .then(response => response.json())
	    .then(result => {
		console.log('Success:', result);
		// Optionally update the page to show upload status or result
	    })
	    .catch(error => {
		console.error('Error:', error);
	    });
	});
	</script>
</body>
</html>
