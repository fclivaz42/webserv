<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete a file :)</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Delete some shitty files</h1>

    <form id="deleteForm">
        <label for="filename">Select a file :</label>
        <select id="filename" name="filename">
            <option value="test1.txt">test1.txt</option>
            <option value="test2.txt">test2.txt</option>
            <option value="no_permission.txt">no_permission.txt</option>
        </select>
        <button id="delete_button" class="request_button" type="submit">Deleteeeeee ....</button>
    </form>

    <p id="responseMessage"></p>

    <script>
        document.getElementById('deleteForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Empêche le rechargement de la page
            const currentPort = window.location.port || 80;
            const filename = document.getElementById('filename').value;
            // Forme l'URL avec le chemin correct du fichier à supprimer
            const url = `http://localhost:${currentPort}/delete/${filename}`;

            fetch(url, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('responseMessage').textContent = `Le fichier ${filename} a été supprimé avec succès.`;
                } else if (response.status === 404) {
                    document.getElementById('responseMessage').textContent = `Le fichier ${filename} n'a pas été trouvé.`;
                } else if (response.status === 403) {
                    document.getElementById('responseMessage').textContent = `Permissions insuffisantes pour supprimer le fichier ${filename}.`;
                } else {
                    document.getElementById('responseMessage').textContent = `Erreur lors de la suppression du fichier ${filename}.`;
                }
            })
            .catch(error => {
                document.getElementById('responseMessage').textContent = `Erreur réseau : ${error}`;
            });
        });
    </script>
</body>
</html>
