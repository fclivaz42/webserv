<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Sexy...</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
	<h1>One, two, testing</h1>
	<h3>Like a queeeeeen</h3>
	<div class="requests">
	    <button class="request_button" onclick="sendGetRequest(8080)">send get request on port 8080</button>
	    <button class="request_button" onclick="sendPostRequest(8080)">send post request on port 8080</button>
	    <button class="request_button" onclick="sendDeleteRequest(8080)">send delete request on port 8080</button>
	</div>

    	<script>
		function sendGetRequest(port) {
		    fetch(`http://localhost:${port}`, {
			method: 'GET',
		    })
		    .then(response => {
			console.log(`Response status from port ${port}:`, response.status);
			return response.text();
		    })
		    .then(data => {
			console.log(`GET Response from port ${port}:`, data);
		    })
		    .catch(error => console.error('Error:', error));
		}

		 function sendPostRequest(port) {
		    fetch(`http://localhost:${port}`, {
			method: 'POST',
			headers: {
			    'Content-Type': 'application/x-www-form-urlencoded',
			},
			body: new URLSearchParams({
			    'body': 'This is a POST request body',
			}),
		    })
		    .then(response => response.text())
		    .then(data => {
			console.log(`POST response from port ${port}:`, data);
		    })
		    .catch(error => console.error('Error:', error));
		}

		function sendDeleteRequest(port) {
		    fetch(`http://localhost:${port}`, {
			method: 'DELETE',
		    })
		    .then(response => response.text())
		    .then(data => {
			console.log(`DELETE response from port ${port}:`, data);
		    })
		    .catch(error => console.error('Error:', error));
		}
	</script>

</body>
</html>
