<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
	<nav>
		<a class="request_button" href="/formulaire.html">Get in Touch !</a>
		<a class="black request_button" href="/index.html">Welcome Page</a>
		<a class="request_button" href="/upload.html">Upload a picture</a>
	</nav>

	<h1>Contact Us</h1>
	<form class="contact-form" action="/submit.html" method="post">
	<label for="name">Name:</label>
	<input type="text" id="name" name="name" required>

	<label for="email">Email:</label>
	<input type="email" id="email" name="email" required>

	<label for="message">Message:</label>
	<textarea id="message" name="message" rows="4" required></textarea>

	<button class="request_button" type="submit">Send</button>
	</form>
</body>
</html>
