server {
    server_name example.com
    listen 8080
    listen 3000
    root /public
    index index.html

    location / {
        methods GET POST
        root /public
        index index.html
	}

    location /upload {
        methods POST
        root /public/uploads
        accept_uploads yes
    }

    error_page 404 /404.html
}

server {
    server_name test.com
    listen 8080
    root /var/www/test.com
    index index.html

    location / {
        methods GET
        root /public
        index index.html
    }

    error_page 404 /404.html
}
