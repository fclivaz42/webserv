server {
	server_name servidordelweb.ch
	listen 8080
	listen 3000
	root ./public
	index index.html
	max_body_size 4194304

	location / {
		methods GET POST
		root /
		index index.html
		default_location true
	}

	location /uploads {
		methods POST
		root user_uploads
		accept_uploads yes
	}

	location /upload {
		methods POST
		return_url /uploads
    }

	location /download {
		methods GET
		root user_uploads
		auto_index true
	}

	location /downloads {
		methods GET
		return_url /download
	}

	location /nvim {
		methods GET
		return_url https://github.com/fclivaz42/42-nvim
	}

	location /delete {
		methods DELETE
		root /delete_test
	}

	location /deletation {
		methods DELETE
		return_url /delete
	}

	location /cgi {
		methods GET POST
		root /cgi-bin
		fastcgiPass /usr/bin/python3
		fastcgiIndex .py
	}

	error_path ./public/errors/
}

server {
	server_name localhost
	listen 4247
	listen 8080
	root /var/www/test.com
	max_body_size 15

	location /cgi {
		root /cgi-bin
		default_location yes
		index index.html
		methods GET POST
	}

	error_path  /var/www/errors/
}
