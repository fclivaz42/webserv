server {
	server_name localhost
	listen 8080
	listen 3000
	root ./public
	index index.html
	max_body_size 41943040000000000
#	max_body_size 4194304

	location / {
		methods GET POST
		root /
		index index.html
		default_location true
	}

	location /uploads {
		methods POST
		root user_uploads
		accept_uploads yes
	}

	location /upload {
		methods GET POST
		return_url /upload.html
    }

	location /download {
		methods GET
		root user_uploads
		auto_index true
	}

	location /downloads {
		methods GET
		return_url /download
	}

	location /nvim {
		methods GET
		return_url https://github.com/fclivaz42/42-nvim
	}

	location /delete {
		methods DELETE
		root /delete_test
	}

	location /deletation {
		methods GET DELETE
		return_url /delete.html
	}

	location /cgi {
		methods GET POST
		root /cgi-bin
		fastcgiPass /usr/bin/python3
		fastcgiIndex .py
	}

	error_path ./public/errors/
}

server {
	server_name 127.0.0.1
	listen 4247
	listen 8080
	root ./public
	index index2.html
	max_body_size 300000

	location / {
		methods GET 
		root /
		index index2.html
		default_location true
	}

	location /cgi {
		methods GET POST
		fastcgiPass /cgi-bin/calculator.py
		fastcgiIndex .py
	}

	error_path  ./public/errors/
}
