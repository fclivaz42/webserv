server {
    server_name example.com
    listen 8080
    listen 3000
    root /var/www/example.com
    index index.html
    max_body_size 300000

    location ./ {
        methods GET POST
        root ./public
        index index.html
    }

    location ./upload {
        methods POST
        root /var/www/example.com/uploads
        accept_uploads yes
    }

    error_page ./public/errors/40x.html
}

server {
    server_name test.com
    listen 8080
    root /var/www/test.com
    index index.html
    max_body_size 300000

    location /cgi {
        methods GET
        fastcgiPass /cgi-bin/script.py
        fastcgiIndex .py
    }

    error_page  ./public/errors/404.html
}
